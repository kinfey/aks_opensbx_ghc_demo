<text data-id="e29" data-width="334" x="1050" y="664" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="1050" y="684">Guest kernel B</tspan><tspan x="1050" y="712">Separate processes and temp state</tspan><tspan x="1050" y="740">A node can host several sandboxes</tspan></text>
