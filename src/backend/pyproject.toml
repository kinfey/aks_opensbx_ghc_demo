[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdonalds-copilot-api"
version = "0.1.0"
description = "FastAPI orchestrator for Copilot CLI running in OpenSandbox"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25,<2",
    "azure-monitor-opentelemetry>=1.8,<2",
    "fastapi>=0.116,<1",
    "opensandbox>=0.1,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
