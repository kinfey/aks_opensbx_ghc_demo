<text data-id="e23" data-width="342" x="116" y="664" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="116" y="684">Lifecycle API + Controller</tspan><tspan x="116" y="712">BatchSandbox + Ingress gateway</tspan><tspan x="116" y="740">execd 就绪后再执行</tspan></text>
