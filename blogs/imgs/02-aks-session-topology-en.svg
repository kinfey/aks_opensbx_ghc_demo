<text data-id="e32" data-width="1200" x="92" y="928" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#000000"><tspan x="92" y="949">Allowed external services: GitHub Copilot APIs (model inference) / read-only remote MCP</tspan></text>
<text data-id="e33" data-width="1372" x="64" y="996" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="64" y="1014">A session ID is not a user identity. Reuse retains temporary state; deletion is not persistence.</tspan></text>
