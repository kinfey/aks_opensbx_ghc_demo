<text data-id="e26" data-width="375" x="1030" y="662" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="1030" y="687">Platform manages</tspan></text>
<text data-id="e27" data-width="375" x="1030" y="716" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="1030" y="734">Allocation and pool lifecycle</tspan><tspan x="1030" y="759.2">Ephemeral state cleaned after cooldown</tspan></text>
