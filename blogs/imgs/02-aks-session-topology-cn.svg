<text data-id="e32" data-width="1200" x="92" y="928" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#000000"><tspan x="92" y="949">允许的外部服务：GitHub Copilot API（模型推理） / 只读远程 MCP</tspan></text>
<text data-id="e33" data-width="1372" x="64" y="996" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="64" y="1014">会话 ID 不是用户身份；复用期间保留临时状态，删除沙箱不等于持久化。</tspan></text>
