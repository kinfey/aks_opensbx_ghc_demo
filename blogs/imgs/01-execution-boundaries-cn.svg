<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title">
<title id="title">01-execution-boundaries / cn</title>
<rect width="1500" height="1080" fill="#ffffff"/>
<path d="M64 197 H1436" stroke="#0078D4" stroke-width="4"/>
<text data-id="e1" data-width="1200" x="64" y="28" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#000000"><tspan x="64" y="45">FIELD NOTES / 01     OPENSANDBOX x AZURE</tspan></text>
<text data-id="e2" data-width="1372" x="64" y="80" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="39" fill="#000000"><tspan x="64" y="119">模型负责推理，执行平台负责边界</tspan></text>
<text data-id="e3" data-width="1372" x="64" y="146" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#000000"><tspan x="64" y="168">协议、工作环境和隔离机制，是三个不同层次。</tspan></text>
<rect x="64" y="230" width="390" height="170" rx="14" stroke="#0078D4" stroke-width="2" fill="#CFE4FA"/>
<text data-id="e5" data-width="342" x="88" y="252" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="88" y="277">模型与智能体</tspan></text>
<text data-id="e6" data-width="342" x="88" y="304" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="88" y="324">理解目标，规划下一步</tspan><tspan x="88" y="352">不直接信任生成的操作</tspan></text>
<rect x="545" y="230" width="390" height="170" rx="14" stroke="#5C2D91" stroke-width="2" fill="#E8DAEF"/>
<text data-id="e8" data-width="342" x="569" y="252" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="569" y="277">应用策略</tspan></text>
<text data-id="e9" data-width="342" x="569" y="304" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="569" y="324">身份、工具白名单、确认流程</tspan><tspan x="569" y="352">授权检查发生在执行前</tspan></text>
<rect x="1026" y="230" width="410" height="170" rx="14" stroke="#107C10" stroke-width="2" fill="#DFF6DD"/>
<text data-id="e11" data-width="362" x="1050" y="252" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="1050" y="277">结果与工件</tspan></text>
<text data-id="e12" data-width="362" x="1050" y="304" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="1050" y="324">验证结果，保留来源</tspan><tspan x="1050" y="352">展示不等于证明成功</tspan></text>
<path d="M466 313 L530 313 M519.6076951545867 319 L530 313 L519.6076951545867 307" fill="none" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
<path d="M744 412 L744 493 M738 482.60769515458674 L744 493 L750 482.60769515458674" fill="none" stroke="#5C2D91" stroke-width="3" stroke-linecap="round"/>
<text data-id="e15" data-width="370" x="768" y="438" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#000000"><tspan x="768" y="457">有边界的执行</tspan></text>
<rect x="64" y="510" width="1372" height="420" rx="14" stroke="#495057" stroke-width="2" fill="none"/>
<text data-id="e17" data-width="1200" x="88" y="532" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#000000"><tspan x="88" y="558">执行平面：分层而不是混为一谈</tspan></text>
<rect x="94" y="608" width="402" height="250" rx="14" stroke="#0078D4" stroke-width="2" fill="#CFE4FA"/>
<text data-id="e19" data-width="354" x="118" y="630" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="118" y="655">MCP</tspan></text>
<text data-id="e20" data-width="354" x="118" y="682" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="118" y="702">工具发现与调用协议</tspan><tspan x="118" y="730">不等于虚拟机或安全沙箱</tspan><tspan x="118" y="758">本项目仅开放选定工具</tspan></text>
<rect x="548" y="608" width="402" height="250" rx="14" stroke="#5C2D91" stroke-width="2" fill="#E8DAEF"/>
<text data-id="e22" data-width="354" x="572" y="630" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="572" y="655">OpenSandbox</tspan></text>
<text data-id="e23" data-width="354" x="572" y="682" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="572" y="702">创建、执行、文件与生命周期</tspan><tspan x="572" y="730">把工作环境变为应用 API</tspan><tspan x="572" y="758">实际能力取决于运行时</tspan></text>
<rect x="1002" y="608" width="402" height="250" rx="14" stroke="#107C10" stroke-width="2" fill="#DFF6DD"/>
<text data-id="e25" data-width="354" x="1026" y="630" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="1026" y="655">Kata on AKS</tspan></text>
<text data-id="e26" data-width="354" x="1026" y="682" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="1026" y="702">每个沙箱 Pod 的轻量虚拟机</tspan><tspan x="1026" y="730">独立来宾内核</tspan><tspan x="1026" y="758">仍需网络、凭据和应用授权</tspan></text>
<path d="M1230 494 L1230 416 M1236 426.39230484541326 L1230 416 L1224 426.39230484541326" fill="none" stroke="#107C10" stroke-width="3" stroke-linecap="round"/>
<text data-id="e28" data-width="1372" x="64" y="996" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="64" y="1014">关键点：MCP 不是隔离；OpenSandbox 不是模型；Kata 不是完整的授权系统。</tspan></text>
<text data-id="e29" data-width="1200" x="64" y="1036" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#000000"><tspan x="64" y="1051">kinfey/aks_opensbx_ghc_demo  |  2026-10-02  |  Conceptual diagram, not to scale</tspan></text>
</svg>
