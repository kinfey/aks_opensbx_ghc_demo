<text data-id="e29" data-width="334" x="1050" y="664" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="1050" y="684">来宾内核 B</tspan><tspan x="1050" y="712">独立进程与临时状态</tspan><tspan x="1050" y="740">同一节点可承载多个沙箱</tspan></text>
