<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title">
<title id="title">03-control-and-responsibility / cn</title>
<rect width="1500" height="1080" fill="#ffffff"/>
<path d="M64 197 H1436" stroke="#0078D4" stroke-width="4"/>
<text data-id="e1" data-width="1200" x="64" y="28" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#000000"><tspan x="64" y="45">FIELD NOTES / 03     OPENSANDBOX x AZURE</tspan></text>
<text data-id="e2" data-width="1372" x="64" y="80" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="39" fill="#000000"><tspan x="64" y="119">选型比较的是控制权与责任，不是安全排行榜</tspan></text>
<text data-id="e3" data-width="1372" x="64" y="146" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#000000"><tspan x="64" y="168">共同目标：把不可信执行与业务服务分开；不同点：谁管理什么。</tspan></text>
<rect x="64" y="228" width="436" height="672" rx="14" stroke="#5C2D91" stroke-width="2" fill="none"/>
<rect x="80" y="247" width="404" height="130" rx="14" stroke="#5C2D91" stroke-width="2" fill="#E8DAEF"/>
<text data-id="e6" data-width="356" x="104" y="269" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="104" y="294">OpenSandbox on AKS</tspan></text>
<text data-id="e7" data-width="356" x="104" y="321" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="104" y="341">自建的沙箱平台</tspan></text>
<text data-id="e8" data-width="375" x="94" y="410" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="94" y="435">你管理</tspan></text>
<text data-id="e9" data-width="375" x="94" y="464" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="94" y="482">OpenSandbox 控制面与运行时</tspan><tspan x="94" y="507.2">节点容量、镜像、网络与升级</tspan><tspan x="94" y="532.4">会话生命周期和业务策略</tspan></text>
<text data-id="e10" data-width="375" x="94" y="662" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="94" y="687">更适合</tspan></text>
<text data-id="e11" data-width="375" x="94" y="716" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="94" y="734">已有 Kubernetes 平台团队</tspan><tspan x="94" y="759.2">需要运行时控制和可迁移抽象</tspan></text>
<rect x="532" y="228" width="436" height="672" rx="14" stroke="#0078D4" stroke-width="2" fill="none"/>
<rect x="548" y="247" width="404" height="130" rx="14" stroke="#0078D4" stroke-width="2" fill="#CFE4FA"/>
<text data-id="e14" data-width="356" x="572" y="269" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="572" y="294">ACA Sandboxes</tspan></text>
<text data-id="e15" data-width="356" x="572" y="321" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="572" y="341">托管基础设施，显式工作空间</tspan></text>
<text data-id="e16" data-width="375" x="562" y="410" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="562" y="435">你管理</tspan></text>
<text data-id="e17" data-width="375" x="562" y="464" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="562" y="482">单个沙箱的创建、挂起与恢复</tspan><tspan x="562" y="507.2">快照、卷及访问策略的使用</tspan><tspan x="562" y="532.4">应用身份、数据与生命周期</tspan></text>
<text data-id="e18" data-width="375" x="562" y="662" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="562" y="687">平台管理</tspan></text>
<text data-id="e19" data-width="375" x="562" y="716" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="562" y="734">底层沙箱基础设施</tspan><tspan x="562" y="759.2">使用服务提供的能力与边界</tspan></text>
<rect x="1000" y="228" width="436" height="672" rx="14" stroke="#107C10" stroke-width="2" fill="none"/>
<rect x="1016" y="247" width="404" height="130" rx="14" stroke="#107C10" stroke-width="2" fill="#DFF6DD"/>
<text data-id="e22" data-width="356" x="1040" y="269" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="1040" y="294">ACA Dynamic Sessions</tspan></text>
<text data-id="e23" data-width="356" x="1040" y="321" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#000000"><tspan x="1040" y="341">托管池分配的执行会话</tspan></text>
<text data-id="e24" data-width="375" x="1030" y="410" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="1030" y="435">你管理</tspan></text>
<text data-id="e25" data-width="375" x="1030" y="464" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="1030" y="482">Session pool 配置</tspan><tspan x="1030" y="507.2">identifier 路由与业务策略</tspan><tspan x="1030" y="532.4">任务输入、输出和授权</tspan></text>
<text data-id="e26" data-width="375" x="1030" y="662" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#000000"><tspan x="1030" y="687">平台管理</tspan></text>
<text data-id="e27" data-width="375" x="1030" y="716" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="1030" y="734">会话分配和池生命周期</tspan><tspan x="1030" y="759.2">按冷却策略回收临时状态</tspan></text>
<text data-id="e28" data-width="1372" x="64" y="996" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#000000"><tspan x="64" y="1014">托管不会替你完成业务授权；共享 OCI 镜像格式也不意味着生命周期 API 可以直接替换。</tspan></text>
<text data-id="e29" data-width="1200" x="64" y="1036" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#000000"><tspan x="64" y="1051">kinfey/aks_opensbx_ghc_demo  |  2026-10-02  |  Conceptual diagram, not to scale</tspan></text>
</svg>
